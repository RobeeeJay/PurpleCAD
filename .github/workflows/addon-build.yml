name: OCC Addon

on:
  pull_request:

# A new push to a PR cancels that PR's run still going: its result is already
# out of date, and macOS runner minutes are the expensive kind.
concurrency:
  group: addon-build-${{ github.ref }}
  cancel-in-progress: true

# The runners are 3-7x slower than an Apple Silicon Mac on the heavy OCC tests:
# src/testBudget.js stretches the long ones by this much, and the timeout below
# covers the rest (the threaded-hole tests took 5.7 s here against vitest's 5 s
# default). The same settings as release.yml.
env:
  TEST_TIME_SCALE: "3"

jobs:
  build:
    runs-on: macos-15  # arm64 (Apple Silicon) runner; macos-14 is retired

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match local dev (node 24): @electron/rebuild & node-abi require
          # >=22.12, and the lockfile is generated by node 24's npm — node 20's
          # npm 10.8 rejects it as out-of-sync.
          node-version: '24'
          cache: 'npm'

      - name: Install cmake + ninja
        run: brew install cmake ninja

      - name: Cache OCC arm64 build
        id: cache-occ
        uses: actions/cache@v4
        with:
          path: ~/occ-8.0.1-arm64
          # Cache key includes OCC version.  Bump the version string to
          # invalidate and rebuild (takes ~12 min on first run).  Matches the
          # primary dev target in CLAUDE.md (native/occ-addon/CMakeLists.txt
          # looks here FIRST) — CI must build against the SAME version local
          # dev uses, or it can never catch an 8.0-specific regression (e.g.
          # the removed TopTools_ListIteratorOfListOfShape.hxx header).
          key: occ-8.0.1-arm64-${{ runner.os }}-${{ runner.arch }}

      - name: Clone OCC source
        if: steps.cache-occ.outputs.cache-hit != 'true'
        run: |
          # Org is Open-Cascade-SAS — a wrong/nonexistent repo makes git prompt
          # for credentials (private-repo fallback), which fails headless with
          # "could not read Username ... Device not configured".
          git clone --depth 1 --branch V8_0_1 \
            https://github.com/Open-Cascade-SAS/OCCT.git /tmp/occt

      - name: Build and install OCC
        if: steps.cache-occ.outputs.cache-hit != 'true'
        run: |
          # 8.0.0 folded the old DETools module into DataExchange (its
          # TKDESTEP/TKDESTL/TKDEIGES toolkits, which the addon links) — no
          # separate BUILD_MODULE_DETools flag exists any more here.
          cmake -S /tmp/occt -B /tmp/occt-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX=$HOME/occ-8.0.1-arm64 \
            -DBUILD_MODULE_FoundationClasses=ON \
            -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON \
            -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_Visualization=OFF \
            -DBUILD_MODULE_Draw=OFF \
            -DBUILD_MODULE_ApplicationFramework=OFF \
            -DUSE_FREETYPE=OFF \
            -DUSE_TK=OFF \
            -DUSE_OPENGL=OFF
          cmake --build /tmp/occt-build --parallel $(sysctl -n hw.logicalcpu)
          cmake --install /tmp/occt-build

      - name: Install npm dependencies
        run: npm ci

      # native/occ-addon is a SEPARATE package (own package.json/lockfile),
      # not an npm workspace of the root — root `npm ci` above does not
      # install its dependencies (cmake-js, node-addon-api, …). Without this,
      # `npm run addon:build` fails with "cmake-js: command not found".
      - name: Install addon npm dependencies
        run: npm ci --prefix native/occ-addon

      - name: Build addon
        run: npm run addon:build

      - name: Test addon
        run: npm run addon:test

      - name: Unit tests (vitest)
        run: ./scripts/with-display.sh npx vitest run --testTimeout=60000

      - name: Renderer build (vite)
        run: npx vite build

      # occOps.js must stay external to the renderer bundle (its Node
      # createRequire would crash the browser side) — see vite.config.js.
      - name: Verify occ addon absent from bundle
        run: |
          if grep -R "occ_addon" dist/ -q; then
            echo "occ_addon leaked into the renderer bundle" >&2
            exit 1
          fi

      - name: E2E (Playwright + Electron)
        run: |
          npm run sqlite:rebuild
          VITE_E2E=1 vite build
          ./scripts/with-display.sh npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: occ-addon-arm64
          path: native/occ-addon/build/Release/occ_addon.node
          retention-days: 7
